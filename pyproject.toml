[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "league-ews-research"
version = "0.1.0"
description = "Leakage-safe research tools for forecasting strategic League of Legends events"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Keerthivasan Kannan" }]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
research = [
  "matplotlib>=3.9,<4",
  "mlflow>=3.0,<4",
  "pyarrow>=18,<26",
]
graph = [
  "torch>=2.6,<3",
  "torch-geometric>=2.6,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<3",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0",
]
security = ["pip-audit>=2.8,<3"]

[project.scripts]
league-ews = "league_ews.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/league_ews"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=league_ews --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["league_ews"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["audit-data", "legacy", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["league_ews"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
